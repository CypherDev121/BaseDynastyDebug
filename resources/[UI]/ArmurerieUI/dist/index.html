<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Supérette</title>
    <link rel="stylesheet" href="tr4vis.css" />
    <link
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
      rel="stylesheet"
    />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

    <style>
      @import url("https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Teko:wght@300..700&display=swap");
    </style>
  </head>
  <body>
    <div class="menu">
      <div class="main">
        <div class="header">
          <div class="logo-container">
            <div class="logo-background">
              <img
              src="https://cdn.discordapp.com/attachments/1314229874613031065/1335091692176670730/logo-2adca9e8.png?ex=67b7f508&is=67b6a388&hm=d2267bf7841266afe65815d115c1bad311cea248e716503a62c8bab0af3142d2&"
              alt="Logo"
                class="header-logo"
              />
              <div class="logo-text">
                <span class="main-text">DYNASTY RP   </span>
                <span class="sub-text">24/7</span>
              </div>
            </div>          
          </div>          
          <img src="assets/tr4visperso.png" alt="perso" class="perso">
          <input
            type="text"
            placeholder="Rechercher un article"
            class="search-bar"
          />
        </div>
        <div class="sidebar">
          <button id="food" class="category-btn" style="display: none">
            <img
              src="assets/aaa.png"
              alt="Nourriture Logo"
              class="category-logo"
            />
            Nourriture
          </button>

          <button id="props" class="category-btn" style="display: none">
            <img src="assets/aaa.png" alt="Props Logo" class="category-logo" />
            Props
          </button>

          <button id="illegalitem" class="category-btn" style="display: none">
            <img src="assets/aaa.png" alt="Props Logo" class="category-logo" />
            Outils
          </button>
          <button class="quit-btn">
            ✖
          </button>          
        </div>
        <div class="items">
          <button class="item">
            <img src="assets/bread.png" alt="Pain" />
            <div class="item-name">
              <div class="item-price">$10</div>
              Pain
            </div>
          </button>
          <button class="item">
            <img src="assets/cola.png" alt="Eau" />
            <div class="item-name">
              <div class="item-price">$10</div>
              Eau
            </div>
          </button>
        </div>
        <div class="cart">
          <h3 class="cart-title"><i class="bx bx-basket"></i> Panier :</h3>
          <div class="cart-item-list">
            <div class="cart-item">
              <span>Eau</span>
              <div class="quantity-controls">
                <button class="quantity-btn">-</button>
                <span class="item-quantity">1</span>
                <button class="quantity-btn">+</button>
                <span class="cart-item-price">$10</span>
              </div>
              <button class="remove-btn"><i class="bx bx-x"></i></button>
            </div>
            <div class="cart-item">
              <span>Pain</span>
              <div class="quantity-controls">
                <button class="quantity-btn">-</button>
                <span class="item-quantity">1</span>
                <button class="quantity-btn">+</button>
                <span class="cart-item-price">$10</span>
              </div>
              <button class="remove-btn"><i class="bx bx-x"></i></button>
            </div>
            <div class="cart-item">
              <span>Telephone</span>
              <div class="quantity-controls">
                <button class="quantity-btn">-</button>
                <span class="item-quantity">1</span>
                <button class="quantity-btn">+</button>
                <span class="cart-item-price">$10</span>
              </div>
              <button class="remove-btn"><i class="bx bx-x"></i></button>
            </div>
          </div>
          <div class="total">
            <span
              ><strong>Total :</strong>
              <span class="total-price">$30</span></span
            >
          </div>

          <button id="totalid" class="checkout-btn">
            <div class="checkout-div">
              <strong class="checkout-text">Payer</strong>
            </div>
          </button>
        </div>
      </div>
    </div>
    <script src="scripts.js"></script>
  </body>
</html>
